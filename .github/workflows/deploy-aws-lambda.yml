name: Deploy AWS Lambda
on:
  push:
    branches:
      - develop

env:
  AWS_REGION: eu-west-3
  PYTHON_VERSION: '3.13'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function:
          - name: authorize
            dir: ./functions/authorize
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1.7.0
        with:
          role-to-assume: arn:aws:iam::093549766891:role/GitHubAction
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install -r ${{ matrix.function.dir }}/requirements.txt \
            --target ${{ matrix.function.dir }}/package

      - name: Package Lambda
        run: |
          cd ${{ matrix.function.dir }}/package
          zip -r ../lambda.zip .
          cd ..
          zip -g lambda.zip *.py

      - name: Deploy Lambda Function
        run: |
          aws lambda update-function-code \
            --function-name ${{ matrix.function.name }} \
            --zip-file fileb://${{ matrix.function.dir }}/lambda.zip