name: Deploy AWS Lambda
on:
  push:
    branches:
      - develop

env:
  AWS_REGION: eu-west-3
  PYTHON_VERSION: '3.13'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function:
          - name: authorize
            dir: ./functions/authorize
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1.7.0
        with:
          role-to-assume: arn:aws:iam::093549766891:role/GitHubAction
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install -r ${{ matrix.function.dir }}/requirements.txt \
            --target ${{ matrix.function.dir }}/package

      - name: Package Lambda
        run: |
          cd ${{ matrix.function.dir }}/package
          zip -r ../lambda.zip .
          cd ..
          zip -g lambda.zip *.py

      - name: Deploy Lambda Function
        run: |
          aws lambda update-function-code \
            --function-name ${{ matrix.function.name }} \
            --zip-file fileb://${{ matrix.function.dir }}/lambda.zip

      - name: Deploy Lambda Environment Variables
        run: |
          ENV_FILE="${{ matrix.function.dir }}/.env"

          if [ ! -f "$ENV_FILE" ]; then
            echo "No .env file found at $ENV_FILE, skipping env var deployment."
            exit 0
          fi

          # Parse .env into {"KEY":"VALUE",...} JSON, skipping comments and blank lines
          ENV_JSON=$(grep -v '^\s*#' "$ENV_FILE" | grep -v '^\s*$' | \
            awk -F '=' '{
              key = $1
              sub(/^[[:space:]]+/, "", key)
              sub(/[[:space:]]+$/, "", key)
              val = substr($0, index($0,"=")+1)
              gsub(/^[[:space:]"'"'"']+|[[:space:]"'"'"']+$/, "", val)
              printf "%s\"%s\":\"%s\"", (NR==1 ? "" : ","), key, val
            }' | awk '{print "{"$0"}"}')

          aws lambda update-function-configuration \
            --function-name ${{ matrix.function.name }} \
            --environment "Variables=$ENV_JSON"