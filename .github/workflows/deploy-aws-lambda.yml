name: Deploy AWS Lambda
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function:
          - name: authorize
            dir: ./functions/authorize
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install -r ${{ matrix.function.dir }}/requirements.txt \
            --target ${{ matrix.function.dir }}/package

      - name: Package Lambda
        run: |
          cd ${{ matrix.function.dir }}/package
          zip -r ../lambda.zip .
          cd ..
          zip -g lambda.zip *.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionRole
          aws-region: us-east-1

      - name: Deploy Lambda Function
        run: |
          aws lambda update-function-code \
            --function-name ${{ matrix.function.name }} \
            --zip-file fileb://${{ matrix.function.dir }}/lambda.zip